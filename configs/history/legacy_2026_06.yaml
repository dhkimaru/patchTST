# 초기 작업 기록 (2026-06 ~ 07, Keras). 집계 지표와 설정만 담는다. ald-report '이전 실험' 탭이 읽는다.
title: 초기 작업 — Keras 다중 대상 예측과 학습 파이프라인 재구축
period: 2026-06 ~ 2026-07
order: 3
timeline:
  - {when: "2026-06", title: "처음 Keras 코드", key: "10초 오차 3.2~4.1", note: "현재값 유지(1.1)보다 나쁨 · 학습·평가 데이터가 겹침"}
  - {when: "2026-07", title: "학습 파이프라인 재구축", key: "결함 39건 정리", note: "run 단위 분할 · 학습 run 정규화 · 데이터 로더 46배 빠르게"}
summary: >-
  처음 코드(TensorFlow/Keras)로 VG11 등 대상 10개의 10·20·30초 뒤 값을 예측하도록 학습했고, 2026-06-14에 run 3개(066~068)로
  10초 예측을 확인했다. 이후 코드 점검에서 학습·검증 데이터가 겹치는 문제 등 결함 39건(치명 4 · 높음 21 · 보통 14)을 찾아,
  2026-07에 run 단위 분할과 학습 run 정규화로 학습 파이프라인을 다시 만들었다. 이것이 2026-08 단계 실험의 출발점이다.
setup:
  - ["대상", "학습 10개: VG11, MFCMon_P.POS·L.POS, VG12, VG13, N2-1~4, APCValveMon. 노트북 평가는 17개 (온도·DCS·NH3·F.PWR 포함, 학습 기록 없는 모델 포함)"]
  - ["입력", "신호 37개 (대상 자신의 과거 포함), 192 step, 0.5초 → 1초 (1개씩 건너뜀)"]
  - ["모델", "신호를 섞는 patch Transformer: patch 16 / stride 16, d_model 64, head 4, layer 2, ff 128, dropout 0.1, 평균(GAP) → Dense (PatchTST 원형과 다름)"]
  - ["학습", "Adam 5e-4, batch 256, 최대 200 epoch을 파일 묶음 4번에 이어서, 조기 종료 10, 학습률 감소. 손실 MAE (VG11은 0~9 구간 ×100 가중)"]
  - ["정규화", "코드에 적은 고정 범위 (예: VG11 0.7~771.6)"]
  - ["분할", "파일 이름순 69 / 5 (뒤 5개 '시험'은 쓰이지 않음). 검증은 window 단위 마지막 10 % → 같은 run이 학습·검증에 걸침"]
  - ["저장", "대상별 .keras 모델 + scaler .pkl"]
