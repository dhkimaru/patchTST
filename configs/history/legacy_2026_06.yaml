caveats:
  - "066~068은 학습 데이터에도 들어 있어 실제보다 좋게 나왔을 수 있다. 그런데도 VG11 10초 오차(3.2~4.1)가 현재값 유지 수준(약 1.1)보다 크다."
  - "평가 반복문의 break 때문에 10초만 평가했고 20·30초는 평가하지 않았다. RMSE·R²는 기록 없음."
  - "노트북에서 시각이 21행 늦게 붙고, 보정 모델이 위치 기준으로 예측을 덮어쓴다."
problems:
  - ["데이터 겹침", "window 단위 90/10 분할로 같은 run이 학습·검증에 걸침 (window끼리 최대 191/192행 공유)"]
  - ["평가 run 노출", "066~068을 학습에도 쓰고 평가에도 씀"]
  - ["시험 run 미사용", "이름순 마지막 5개를 '시험'으로 두고 평가하지 않음"]
  - ["10초만 평가", "평가 반복문의 break"]
  - ["고정 정규화", "범위를 코드에 직접 적음, 여유 15 %는 계산만 하고 거의 안 씀"]
  - ["시간 무시", "시간 열을 버리고 행 순서만 사용, 끊김·역행을 그대로 이어 붙임"]
  - ["검증 세트 변동", "파일 묶음 4번에 이어 학습하면서 검증 세트가 매번 바뀜"]
  - ["대상·입력 불일치", "학습 10개 vs 평가 17개, 온도 입력 41 vs 39개, 쉼표 누락으로 컬럼 이름이 붙어 버림"]
other:
  - "두께 예측(XGBoost) 스크립트: 결과 기록 없음. 정의되지 않은 변수로 실행 불가, 행 단위 무작위 분할."
  - "2026-07 파이프라인 재구축: run 단위 분할(50 / 11 / 11), 학습 run 정규화, Step ID 원핫 포함 84개 입력. 데이터 로더를 바꿔 batch당 0.758초 → 0.016초(46배), 1 epoch 104분 → 약 2분. 최종 학습은 끝까지 가지 않음."
  - "회의용 시나리오·가상 데이터 스크립트 3개 (예측만, 결과 파일 미보관)."
