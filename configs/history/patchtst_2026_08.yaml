# 이전 실험 기록 (2026-08, PatchTST 단계 실험). 집계 지표와 설정만 담는다 (샘플 단위 값 없음).
# ald-report의 '이전 실험' 탭이 이 파일을 읽는다. 숫자의 출처는 patchtst-agent-lab/reports/ 의 단계별 보고서.
title: 이전 실험 — VG11 압력 미래 값 예측 (PatchTST 단계 실험)
period: 2026-07 ~ 2026-08
target: VG11
unit: Torr
summary: >-
  VG11(챔버 압력)의 10·20·30초 뒤 값을 PatchTST로 예측했다. 현재값 유지(시험 MAE 2.092) 대비 최종 모델(FA1)이
  0.188로 약 91 % 줄었다. 대신 모델 하나에 2~8시간이 걸려, 기록된 22개 모델에 GPU 약 59시간을 썼다.

inputs:
  - ["원본", "trace 74개 (standard_trace_071은 시간 역행으로 격리 → 73개, 구간 74개), 0.5초 간격"]
  - ["샘플링", "0.5초 → 1초 (2개 중 1개, 구간 첫 행 기준으로 솎아냄)"]
  - ["window", "과거 192초 (192 step)"]
  - ["정규화", "학습 run 전체로 맞춘 StandardScaler (829,936 점) + 모델 안의 RevIN"]
  - ["구간 분할", "시간 끊김(0.5초 ± 0.01초 밖)·역행에서 나눔. window가 파일·구간을 넘지 않음"]
  - ["분할 (split_v2)", "학습 51 / 검증 11 / 시험 11 파일 → window 818,665 / 177,580 / 179,169"]
input_sets:
  - ["F_VG11_ONLY", 1, "VG11만"]
  - ["F_CI_ORIGINAL", 37, "MFC 9·APC·압력계(VG11·VG12·VG13·PressAct·AUXMon_VG11)·온도 5 zone·밸브 17 (상수인 MFCMon_F2 제외)"]
  - ["F_FORECAST_NO_PROXY", 35, "F_CI_ORIGINAL에서 VG11 복사본(PressAct·AUXMon_VG11) 제외"]

outputs:
  - ["대상", "VG11의 10·20·30초 뒤 값 (3개)"]
  - ["평가", "시험 window 179,169개 전체. 물리 단위로 되돌린 MAE의 3개 horizon 평균"]
  - ["구간 평가", "Stable / Transition (예측 시점 ±30초 안에 step이 바뀌면 Transition)"]

defaults:
  - ["PatchTST 기본 구조", "patch 16 / stride 8 (24 patch), d_model 128, head 16, layer 3, d_ff 256, dropout 0.05, BatchNorm, residual attention, RevIN, flatten head"]
  - ["optimizer", "Adam, lr 1e-4, weight decay 0, scheduler 없음"]
  - ["손실", "정규화 공간 MSE"]
  - ["batch / epoch", "batch 128, 최대 100 epoch, 조기 종료 patience 10, 매 epoch 학습 window 전체(818,665개)"]
  - ["정밀도·장비", "AMP, RTX 4090 1장"]
  - ["속도", "학습 초당 3,620 window (O_UNIVARIATE), 3,105 (O_CI), GPU 메모리 90~160 MB (O_CI 2.8 GB)"]

# step, id, 이름, 입력, 바꾼 점, 시험 MAE(평균), [10s, 20s, 30s], stable, transition, best/epochs, 학습 시간(h), 파라미터 수
runs:
  - {journey: true, step: 기준선, id: Persistence, name: 현재값 유지, inputs: "VG11", change: "지금 값이 그대로 간다고 봄 (학습 없음)",
     mae: 2.092, by_h: [1.107, 2.102, 3.068], stable: 2.395, transition: 1.578, epochs: "-", hours: null, params: 0}
  - {journey: true, step: 2A, id: O_UNIVARIATE, name: PatchTST 원형 (VG11만), inputs: "F_VG11_ONLY (1)", change: "원형 PatchTST, 신호별 독립",
     mae: 0.2345, by_h: [0.146, 0.221, 0.337], stable: 0.202, transition: 0.290, epochs: "32/42", hours: 3.21, params: 411907}
  - {step: 2A, id: O_CI, name: PatchTST 원형 (37신호 독립), inputs: "F_CI_ORIGINAL (37)", change: "37신호를 따로 처리하고 37×3을 모두 맞춤",
     mae: 1.117, by_h: [0.705, 1.213, 1.433], stable: 1.217, transition: 0.947, epochs: "65/75", hours: 6.68, params: 411907}
  - {journey: true, step: 2B, id: C_LEGACY, name: 기존 Keras 구조 재현, inputs: "F_CI_ORIGINAL (37)", change: "신호 혼합, patch 16/stride 16, LayerNorm, RevIN 없음, 가중 MAE, lr 5e-4",
     mae: 2.020, by_h: [1.873, 2.107, 2.080], stable: null, transition: null, epochs: "18/-", hours: 1.81, params: 209475}
  - {step: 2C, id: S1, name: 신호 혼합 (37×3 출력), inputs: "F_CI_ORIGINAL (37)", change: "patch마다 37신호를 섞어 입력, 37신호 모두 예측",
     mae: 0.773, by_h: [0.597, 0.759, 0.964], stable: 0.723, transition: 0.859, epochs: "100/100", hours: 7.72, params: 817519}
  - {journey: true, step: 2C, id: S2 (=FA1), name: 신호 혼합 + VG11 손실, inputs: "F_CI_ORIGINAL (37)", change: "S1과 같은 입력, 출력·손실을 VG11만으로",
     mae: 0.1876, by_h: [0.137, 0.181, 0.244], stable: 0.173, transition: 0.212, epochs: "34/44", hours: 3.40, params: 485635, best: true}
  - {step: 2E, id: FA0, name: VG11만 혼합 구조, inputs: "F_VG11_ONLY (1)", change: "S2 구조를 VG11 하나로",
     mae: 0.193, by_h: [0.120, 0.187, 0.272], stable: 0.164, transition: 0.242, epochs: "53/63", hours: 4.79, params: 411907}
  - {step: 2E, id: FA2, name: 복사본 제외, inputs: "F_FORECAST_NO_PROXY (35)", change: "S2에서 PressAct·AUXMon_VG11 제외",
     mae: 0.200, by_h: [0.154, 0.195, 0.253], stable: 0.195, transition: 0.209, epochs: "32/42", hours: 3.24, params: 481539}
  - {step: 2E, id: VB1 / VB2, name: VG11 이력 없이 (가상 센서 시도), inputs: "VG11 제외", change: "VG11 과거값 없이 나머지 신호로 VG11 예측",
     mae: 11.978, by_h: null, stable: null, transition: null, epochs: "-", hours: 1.86, params: null,
     note: "VB1 16.816 / VB2 11.978 — 현재값 유지보다 나쁨 (실패)"}

ablations:
  - ["2D 원인 분석", "A02 0.191에서 하나씩 바꿈: RevIN 제거 2.032 · LayerNorm 0.242 · pre-norm 0.194. 기존 설정을 차례로 누적(A01→A09)하면 0.214 → 8.542 (최대 A07 9.546), 16.1시간"]
  - ["2F 시드 반복", "FA1 3 seed 0.1985 ± 0.0145 · O_UNIVARIATE 0.2466 ± 0.0112 (seed만 바꿔도 ±0.015 변동)"]
  - ["2G 마무리 실험", "Softplus 하한 0.2135 · Step 임베딩 0.2125 · 0.5초 샘플링 0.252 — 어느 것도 FA1(0.188)보다 낫지 않음"]
  - ["2G 급변 구간", "검증 기준 상위 10 % 변화 구간(시험 18,759 window): FA1 0.738 · O_UNIVARIATE 1.283 · 현재값 유지 18.78"]
  - ["3 단계", "학습 없이 실험 자동화 관리 구조와 FA1 재현 확인만 함"]

lessons:
  - "정규화(RevIN)가 성능을 결정했다: RevIN만 빼도 0.191 → 2.032 (현재값 유지 수준)."
  - "신호를 섞어 보고(mixing) 손실을 VG11에만 두는 것이 가장 좋았다 (S1 0.773 → S2 0.188)."
  - "VG11 과거값이 있으면 복사본을 빼도 유지되지만(FA2 0.200), VG11 과거값 없이 VG11을 추정하는 가상 센서는 실패했다 (12~17)."
  - "seed 변동이 ±0.015라 0.19와 0.20의 차이는 의미가 없다."
limits:
  - "모델 하나에 2~8시간 (초당 약 3,600 window, GPU 메모리 150 MB만 사용) → 하루에 몇 개밖에 못 돌림"
  - "대상이 VG11 하나, ALD 사이클 구간과 그 외를 나눠 보지 않음"
  - "가상 센서(대상 센서 없이 추정)는 성공하지 못함"
gpu_hours: 59.4
# Training speed of the previous code (for the 특이사항 tab): per-window CPU Dataset + DataLoader, batch 128.
speed:
  windows_per_second: 3600
  hours_per_model: [2, 8]
  hours_examples: "PatchTST 원형 3.2시간 · FA1 2.3~3.6시간 · S1 7.7시간"
  gpu_memory_mb: 150
  batch_size: 128
  per_window_work: "배열 자르기·전치·복사 2번, 시각 문자열 4개, recipe·step JSON 해석 2번"
  code: "patchtst-agent-lab/src/patchtst_lab/preprocessing/prepared_cache.py (WindowDataset.__getitem__)"
gpu_hours_note: "시간이 기록된 22개 모델 합계. 기록이 없는 7개(N01~N03, CR00, GP1, GS1, GM1) 제외"

weights:
  format: "PyTorch torch.save dict (model·optimizer state, epoch, 지표, 설정, 데이터 해시, seed)"
  path: "/data1/Agent/patchtst-agent-lab/artifacts/experiments/<단계>/<모델>/seed_NN/best.pt (+ last.pt)"
  note: "이 단계 실험은 모두 PyTorch(.pt)다. 처음 코드(patchTST_v2.py)의 Keras 구조는 C_LEGACY로 PyTorch에서 재현했다."
commands:
  - ["환경", "cd /data1/Agent/patchtst-agent-lab && source .venv-gpu/bin/activate (각 명령 앞에 PYTHONPATH=src)"]
  - ["2A", "python scripts/run_original_experiment.py --model-id O_UNIVARIATE --seed 42"]
  - ["2B", "python scripts/run_legacy_experiment.py --gpu-id 1"]
  - ["2C", "python scripts/run_phase2c_experiment.py --step S2 --gpu-id 1"]
  - ["2D", "python scripts/run_phase2d_experiment.py --step A01 --gpu-id 1"]
  - ["2E", "python scripts/run_phase2e_experiment.py --step FA0 --gpu-id 1"]
  - ["2F", "python scripts/run_phase2f_experiment.py --step FA1 --seed 43 --gpu-id 1"]
  - ["2G", "python scripts/run_phase2g_closure.py --step GP1_SOFTPLUS --gpu-id 0"]

order: 2   # 보고서에서 위에 나오는 순서 (작을수록 위)
