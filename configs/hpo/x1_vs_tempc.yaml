# 가상 센서 TempAct_C 1초 공정 전체 모델: 극한 탐색 (검증 MAE)
# scripts/hpo_studies.py가 만든 파일. 고칠 때는 스크립트를 고치고 다시 만든다.
# 실행: ald-queue submit configs/hpo/x1_vs_tempc.yaml  (또는 ald-hpo run ... --gpus 0,1,2,3)
name: x1_vs_tempc
description: '가상 센서 TempAct_C 1초 공정 전체 모델: 극한 탐색 (검증 MAE)'
base: g1_virtual_sensor
target: TempAct_C
model: patchtst
objective: mae
trials: 150
seed: 42
sampler:
  kind: tpe
  multivariate: true
  n_startup_trials: 20
  constant_liar: true
  seed: 0
pruner:
  kind: hyperband
  min_resource: 20
  reduction_factor: 3
train:
  min_epochs: 20
  patience: 10
  loss: mae
fixed:
  channel_mode: mixing
space:
  train.lr:
    type: float
    low: 3.0e-05
    high: 0.003
    log: true
  train.lr_schedule:
  - plateau
  - cosine
  train.warmup_epochs:
  - 0
  - 5
  train.weight_decay:
    type: float
    low: 1.0e-06
    high: 0.1
    log: true
  train.batch_size:
  - 256
  - 512
  - 1024
  - 2048
  train.max_epochs:
  - 40
  - 80
  - 120
  - 200
  n_layers:
    type: int
    low: 2
    high: 10
  d_model:
  - 64
  - 128
  - 192
  - 256
  - 384
  n_heads:
  - 4
  - 8
  - 16
  d_ff:
  - 128
  - 256
  - 512
  - 1024
  dropout:
  - 0.0
  - 0.05
  - 0.1
  - 0.2
  - 0.3
  attn_dropout:
  - 0.0
  - 0.1
  head_dropout:
  - 0.0
  - 0.1
  norm:
  - batch
  - layer
  stride_ratio:
  - 0.25
  - 0.5
  - 1.0
  patch_seconds:
  - 2
  - 4
  - 6.5
  - 8
  - 13
  - 16
  revin:
  - true
  - false
  revin_center:
  - last
  - mean
  window.context_seconds:
  - 32
  - 48
  - 64
  - 96
  - 128
  - 192
  - 256
enqueue_from:
  experiment: g1_virtual_sensor
  metric: mae
  min_seeds: 2
saturation:
  window: 50
  min_gain_pct: 1.0
