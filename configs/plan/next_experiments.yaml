# 다음 실험 후보: 보고서 "다음 실험" 탭의 원본.
# 집계 수치와 설명만 적는다 (회사 원본 데이터·시점별 값 금지).
# status: 계획 | 진행 중 | 완료 | 보류      priority: 1 (먼저) ~ 3
# goal: 카드에 보이는 한 줄 목표. variants_title: 비교 표 제목 (기본 "비교할 설정", 하이퍼파라미터는 "탐색 공간").
# 근거(evidence)의 숫자는 basis에 적은 보고서 기준이다. 실험이 끝나면 status와 result를 고친다.
# 극한 탐색 프로그램 (사용자 결정 2026-11-23): 1단계 하이퍼파라미터 → 2단계 공정 파라미터 → 3단계 새 기법 → 4단계 결합·확정.
# 미래값 예측과 가상 센서에 GPU를 쓰고, 두께 예측은 Ex-situ가 58개 run뿐이라 CPU로 병행한다.
as_of: "2026-11-24"
basis: "중간보고 v2 (1~654차, 11-23) · 논문 원문 38편 검토 · 극한 탐색 0단계 코드와 탐색 설정 19개 (11-24)"
principles:
  - "극한 = 탐색을 더 해도 교차검증 성능이 좋아지지 않는 지점(포화). 최근 50개 trial에서 최고 기록 개선이 max(1%, seed 표준편차)보다 작으면 포화로 본다."
  - "하이퍼파라미터는 하나씩 바꾸지 않고 여러 설정을 함께 바꾼다. 첫 trial은 지금 최고 설정이라 '지금 대비'가 곧 탐색의 효과다."
  - "탐색은 검증 run으로 고르고, trial 결과는 본 기록에서 뺀다(검증 run 하나로 많은 설정을 고른 값은 낙관적). 상위 설정은 seed 3개와 교차검증 5묶음으로 다시 판정한다."
  - "모든 후보는 같은 정답, 같은 행에서 비교한다(0.5초 원본 기준). 비교 기준이 바뀌어 결론을 잘못 읽은 일이 세 번 있었다."
  - "논문의 공개 벤치마크 수치는 근거일 뿐이다. 채택은 우리 데이터의 교차검증(두께는 시간순 평가)으로만 한다."
  - "시험 run은 최종 후보에서 1회만 열고 '시험 run 재사용, 참고'로 표시한다."
categories:
  - key: hp
    title: 1단계 · 하이퍼파라미터 극한
    why: "미래값 예측에서 설정 하나를 바꿀 때마다 오차가 14~23% 줄었지만 설정끼리의 상호작용은 보지 않았다. 가상 센서는 짧은 무작위 탐색(16조합, 15 epoch) 말고는 거의 탐색하지 않았다."
    items:
      - id: X1
        title: 가상 센서 0.5초 조합 (탐색 14개)
        goal: "가스·밸브·APC·VG11·RF 7개 대상에서 PatchTST 설정을 함께 바꿔 포화까지"
        priority: 1
        status: 진행 중
        question: "0.5초 조합의 두 모델(공정 전체, 사이클 전용)을 각각 탐색하면 지금 설정보다 얼마나 좋아지고, 몇 trial에서 포화하는가?"
        evidence:
          - "시험 run에서 가스·밸브·APC는 레시피 평균보다 24~62% 정확해, 온도(87~91%)보다 개선 여지가 크다."
          - "조합의 MAE는 사이클 밖(공정 전체 모델)과 사이클 안(사이클 전용 모델)의 행 가중 합이라, 두 모델을 따로 최적화하면 조합도 최적이 된다."
          - "11-24 첫 탐색(NH3 사이클 전용)이 대기열에서 실행 중이다."
        variants_title: 탐색 공간
        variants:
          - [학습, "학습률 0.00003~0.003, plateau·cosine, warmup 0·5, weight decay 0.000001~0.1, batch 256~2048, 최대 40~200 epoch", "최소 20 epoch, patience 10"]
          - [모델, "층 2~10, d_model 64~384, head 4~16, d_ff 128~1024, dropout 0~0.3, attention·head dropout 0·0.1, batch·layer norm", "신호 혼합 고정"]
          - [데이터, "patch 2~16초(사이클의 1/6·1/3 포함), stride = patch의 0.25~1배, window 32~256초, RevIN 켬·끔·기준", ""]
        method:
          - "Optuna TPE(다변수) + Hyperband(20 epoch부터 중단 판정), GPU 4장에 작업자 4개, 탐색마다 150 trial."
          - "첫 trial = 누적 기록의 지금 최고 설정을 그 학습 설정 그대로 (기준점, 조기 중단 없음)."
          - "대시보드 하이퍼파라미터 탐색 탭 '극한 탐색'에서 체크해 대기열에 넣고 진행 상황과 예상 끝 시각을 본다."
        targets: "NH3, 밸브 29, DCS, APC, VG11, P.POS, R.PWR × (공정 전체, 사이클 전용)"
        metric: "공정 전체 모델은 사이클 밖 MAE, 사이클 전용 모델은 사이클 안 MAE (검증 run)"
        success: "포화에 도달하고, 상위 설정이 seed 3개·교차검증에서 지금 설정보다 묶음 간 표준편차 2배 넘게 좋으면 채택"
        cost: "탐색 하나에 약 150 trial (속도는 첫 탐색 실측으로 계산)"
        prerequisite: ""
        risk: "trial이 많을수록 검증 run 11개에 맞춰질 위험이 커진다. 판정은 교차검증으로만 한다."
      - id: X2
        title: 미래값 예측 (탐색 4개)
        goal: "VG11·APC·온도 C·L.POS의 10~30초 예측을 포화까지"
        priority: 1
        status: 계획
        question: "층 수·d_model이 포화에 가까웠던 지금 설정에서, 학습률 일정·weight decay·window를 함께 바꾸면 더 내려가는가?"
        evidence:
          - "하나씩 바꾼 효과: 학습량 15 → 40 epoch -23%, 손실 MAE -18%, 층 2 → 4 -6%, 4 → 6 -2%, 6 → 8 -1%."
          - "탐색 리더보드 논문(TimeMixer)에서도 양쪽을 튜닝하면 PatchTST와의 차이가 11%에서 5%로 줄었다. 튜닝 자체가 큰 몫이다."
          - "x1_fc_vg11이 11-24 대기열에 있다."
        variants_title: 탐색 공간
        variants:
          - [학습, "가상 센서와 같은 범위 + 최대 80~300 epoch, 손실 MAE·Huber", "최소 40 epoch, patience 15"]
          - [데이터, "patch 8~39초, window 64~1024초, RevIN 켬·끔·기준", ""]
        method:
          - "X1과 같은 방식, 1초 묶음 데이터(지금 설정과 같은 조건)."
        targets: "VG11, APCValveMon, TempAct_C, MFCMon_L.POS"
        metric: "검증 MAE (10·20·30초 평균)"
        success: "X1과 같음"
        cost: "탐색 하나에 150 trial"
        prerequisite: ""
        risk: "미래값 예측의 오차는 대부분 사이클 밖 압력 전환이라, 하이퍼파라미터만으로는 줄어드는 폭이 작을 수 있다(그러면 N2로)."
      - id: X3
        title: 가상 센서 1초 온도 C
        goal: "온도 5 zone의 대표로 1초 공정 전체 모델 탐색"
        priority: 2
        status: 계획
        question: "이미 레시피 평균보다 91% 정확한 온도도 설정을 함께 바꾸면 더 내려가는가?"
        evidence:
          - "온도는 학습 run 31개에서 포화했다(run 수 곡선). 남은 여지는 모델·입력 쪽이다."
        variants_title: 탐색 공간
        variants:
          - [전부, "X1과 같은 범위, 1초 데이터", ""]
        method:
          - "결과가 좋으면 같은 설정을 온도 5개 전부에 seed 3개로 적용한다."
        targets: "TempAct_C (나머지 온도 4개에 적용)"
        metric: "검증 MAE"
        success: "X1과 같음"
        cost: "150 trial"
        prerequisite: ""
        risk: ""
      - id: X4
        title: 상위 설정 확정
        goal: "탐색마다 상위 5개를 seed 3개·교차검증으로 다시 학습해 대상 24개의 설정을 정한다"
        priority: 1
        status: 계획
        question: "검증 run에서 고른 상위 설정이 seed와 run을 바꿔도 지금 설정보다 나은가?"
        evidence:
          - "seed만 바꿔도 VG11 MAE가 약 7% 흔들린 기록이 있다(이전 프로젝트)."
        variants:
          - [top5, "탐색별 상위 5개 × seed 42·43·44", "대시보드 '상위 5개 재학습' 버튼"]
          - [cv, "1위 설정을 교차검증 5묶음에서", "채택 판정"]
          - [전파, "같은 묶음의 나머지 대상(N2-1, N2-4, 밸브 89, 온도 4개, L.POS 등)에 적용", ""]
        method:
          - "ald-hpo top이 상위 설정을 study 표시 hpo_top으로 실험 YAML을 만들어 대기열에 넣는다."
        targets: "가상 센서 16개, 미래값 예측 8개"
        metric: "교차검증 5묶음 평균 개선과 묶음 간 표준편차"
        success: "평균 개선이 묶음 간 표준편차의 2배를 넘고 가장 나쁜 묶음도 개선"
        cost: "대상당 약 15~20개 작업"
        prerequisite: "X1~X3 중 해당 탐색의 포화"
        risk: ""
  - key: process
    title: 2단계 · 공정 파라미터 극한
    why: "가상 센서에서 가장 큰 개선은 데이터를 넣는 방식에서 나왔다(1초 묶음 대신 0.5초 원본과 사이클 전용 모델로 가스·밸브 오차가 절반 아래로). 입력 신호는 164개와 74개 두 점만 봤다."
    items:
      - id: P1
        title: 입력 신호 계열 하나씩 빼기
        goal: "대상마다 꼭 필요한 계열과 없어도 되는 계열"
        priority: 1
        status: 계획
        question: "압력계·온도·히터 출력·MFC·밸브·RF·APC·레시피 설정값 계열을 하나씩 빼면 오차가 얼마나 변하는가?"
        evidence:
          - "164개에서 74개(중요도 A + 압력계·APC·RF 매칭)로 줄이자 미래값 예측 오차가 8% 줄었다. 최적 신호 수가 더 작을 수 있다."
        variants:
          - [all, "1단계 최고 설정, 지금 입력", "기준"]
          - [-계열, "계열 하나씩 제외 (계열 수만큼)", ""]
        method:
          - "1단계 최고 설정을 고정하고 seed 2개로 돌린다. 크게 달라지는 계열만 seed 3개·교차검증으로 확인."
        targets: "X1·X2의 대표 대상"
        metric: "검증 MAE 변화(%)"
        success: "seed 편차 2배를 넘는 변화만 결론에 쓴다"
        cost: "대표 대상 × 계열 수 × seed 2개"
        prerequisite: "X4 (대표 대상의 확정 설정)"
        risk: "같은 정보를 가진 계열끼리 서로 대신해, 하나씩 빼면 중요도가 낮게 보일 수 있다."
      - id: P2
        title: 신호 수와 중요도 등급 곡선
        goal: "중요도 순위 상위 8·16·32·64·164개와 A 등급(62)·A+(74)의 오차 곡선"
        priority: 2
        status: 계획
        question: "현업이 정한 중요도 A 등급이 모델에도 맞는가? 몇 개에서 전체 입력 수준에 닿는가?"
        evidence:
          - "core(A 대표 14개)는 전체 입력보다 평균 34% 나빴다. A_plus(74개)는 전체보다 8% 나았다(미래값 예측)."
        variants:
          - [A, "A 등급 62개", ""]
          - [A+, "A + 등급 없는 압력계·APC·RF 매칭 74개", "지금"]
          - [top-k, "중요도 순위 상위 k개", "k = 8, 16, 32, 64"]
          - [all, "전체 164개", ""]
        method:
          - "탐색 실행기의 data.input_set으로 trial마다 입력 묶음을 바꾼다. 순위는 P1의 계열 중요도로."
        targets: "X1·X2의 대표 대상"
        metric: "검증 MAE vs 신호 수"
        success: "전체와 seed 편차 안에 드는 가장 작은 묶음을 권장 입력으로"
        cost: "묶음 수 × 대상 × seed 2개"
        prerequisite: "P1"
        risk: ""
      - id: P3
        title: 미래값 예측에도 0.5초 원본·사이클 전용
        goal: "가상 센서에서 가장 큰 개선을 낸 데이터 처리를 미래값 예측에"
        priority: 1
        status: 계획
        question: "미래값 예측을 0.5초 원본으로 학습하고 사이클 안은 사이클 전용 모델로 바꾸면 나아지는가?"
        evidence:
          - "가상 센서: 0.5초 조합이 step 맞춤 조합보다 가스·밸브 오차 16~57% 감소(교차검증 5묶음)."
          - "미래값 예측은 아직 1초 묶음이다. 사이클 전용 학습은 사이클 안 오차를 12~32% 줄였지만 run 전체는 거의 그대로였다(오차 대부분이 사이클 밖)."
        variants:
          - [1s, "1초 묶음 (지금)", "기준"]
          - [0.5s, "0.5초 원본", ""]
          - [0.5s+cyc, "0.5초 + 사이클 전용", ""]
        method:
          - "1단계 최고 설정 그대로, 같은 0.5초 행에서 채점한다."
        targets: "미래값 예측 8개"
        metric: "검증 MAE, 사이클 안·밖 MAE"
        success: "교차검증 5묶음에서 seed 편차 2배 넘게 나으면 채택"
        cost: "대상 8개 × 3가지 × seed 3개"
        prerequisite: "X2"
        risk: "0.5초는 window 길이(행 수)가 2배라 학습이 느려진다."
      - id: P4
        title: step 그룹 전용 모델
        goal: "승온·감압·벤트·퍼지처럼 사이클 밖 구간도 전용 모델로"
        priority: 2
        status: 계획
        question: "사이클 밖 오차(VG11 대기압 근처, 미래값 예측의 압력 전환)를 구간 전용 모델로 줄일 수 있는가?"
        evidence:
          - "VG11 가상 센서 오차의 90% 이상이 대기압 근처 구간이고, 시험 run에서 레시피 평균보다 58% 나빴다."
          - "사이클 전용 모델은 사이클 안 오차를 37~76% 줄였다(온도·VG11)."
        variants:
          - [전체, "공정 전체 모델", "기준"]
          - [그룹, "step 그룹별 전용 모델 + 조합", ""]
        method:
          - "step 그룹은 레시피 step 이름으로 나누고, 그룹마다 window 끝이 그 그룹 안인 것만 학습한다."
        targets: "VG11, APC (가상 센서·미래값)"
        metric: "그룹별 MAE, 대기압 근처 구간 MAE"
        success: "대기압 근처 구간에서 레시피 평균보다 나아지면 채택"
        cost: "그룹 수 × 대상 × seed 3개"
        prerequisite: "X1"
        risk: "그룹마다 학습 window가 적어 과적합 위험."
      - id: P5
        title: 0.5초 조합에서 학습 run 수 곡선
        goal: "run을 더 모으면 얼마나 좋아지는지 지금 구성으로 다시"
        priority: 3
        status: 계획
        question: "1초 묶음 시절의 곡선(가스·밸브는 51개까지 계속 감소, 두 번째 추첨에서는 특정 시기 run 영향)이 지금 구성에서도 같은가?"
        evidence:
          - "1초 묶음 시절: 온도 31개에서 포화, 가스·밸브 51개까지 감소, APC·VG11은 run 수와 무관."
        variants:
          - [n, "학습 run 10·20·31·42·51개 × 추첨 2번", ""]
        method:
          - "데이터가 한계면 3단계의 사전학습·증강이 우선이라는 근거가 된다."
        targets: "가스·밸브 6개, APC, VG11"
        metric: "남은 오차 (51개 = 100)"
        success: "참고 실험 (채택 판정 없음)"
        cost: "5 × 2 × 대상"
        prerequisite: "X4"
        risk: ""
  - key: new
    title: 3단계 · 새 기법 (논문 원문 확인)
    why: "논문 원문 38편을 검토해 34개 기법 중 이 데이터(run 74개, 일정한 주기의 사이클, step 기록)에 맞고 난이도가 낮은 것부터 고른다. 공개 벤치마크 수치는 근거일 뿐이다."
    items:
      - id: N1
        title: 마스크 patch 자기지도 사전학습
        goal: "라벨 없는 trace로 인코더를 먼저 학습해 run 수 한계를 넘는다"
        priority: 1
        status: 계획
        question: "학습 run 51개의 trace 전체로 사전학습한 인코더를 미세조정하면 가스·밸브·APC가 나아지는가?"
        evidence:
          - "PatchTST 원문: 교통 예측 96에서 사전학습 후 미세조정 MSE 0.352, 처음부터 지도학습 0.367. 작은 데이터(ETTh2)에서는 지도학습이 나은 경우도 있음."
          - "원문 설정: 겹치지 않는 patch 12점, 40% 가림, 100 epoch, 미세조정은 head 10 epoch 뒤 전체 20 epoch."
        variants:
          - [지도, "1단계 최고 설정", "기준"]
          - [사전학습, "patch 40% 가림 사전학습 + 미세조정", ""]
          - [사이클 가림, "사이클 단위로 가리는 변형 (원문에 없는 제안)", "사이클 반복을 베끼지 못하게"]
        method:
          - "검증·시험 run은 사전학습에 넣지 않는다. 채널 독립 인코더라 가상 센서에는 채널 혼합 head를 붙인다."
        targets: "가상 센서 가스·밸브·APC, 미래값 예측 VG11·APC"
        metric: "교차검증 MAE"
        success: "1단계 최고 설정보다 교차검증에서 나음"
        cost: "사전학습 1회(대상 공통) + 대상별 미세조정"
        prerequisite: "X4"
        risk: "작은 데이터에서는 효과가 없거나 나빠질 수 있다(원문 ETTh2)."
      - id: N2
        title: 미래 step 정보 + TimeXer (미래값 예측)
        goal: "다음 10~30초의 레시피 step을 모델에 알려 사이클 밖 압력 전환을 맞힌다"
        priority: 1
        status: 계획
        question: "레시피 계획상 다음 step을 입력에 넣으면 미래값 예측의 사이클 밖 오차와 VG11 대기압 근처 오차가 줄어드는가?"
        evidence:
          - "TimeXer 원문: 전력 가격 단기 예측 5개 평균 MSE 0.307, PatchTST 0.330(7% 낮음). 대상 이력을 0으로 채우면 3.7배 나빠져 가상 센서에는 맞지 않는다."
          - "TiDE 원문: 미래 공변량이 중요한 M5에서 WRMSSE 0.611, PatchTST 0.976."
          - "장기 예측에서 레시피 평균이 강했던 것은 미래 step 시각을 알았기 때문이었다(미리 알 수 있는 정보만 쓴 기준보다 19~115% 유리)."
        variants:
          - [지금, "PatchTST, 과거만", "기준"]
          - [+step, "PatchTST + 미래 step (계획값)", ""]
          - [TimeXer, "TimeXer + 미래 step", "외생 신호 분리"]
        method:
          - "step 정보는 신호 열이 아니라 시간 표식(step one-hot, 사이클 위상)으로 넣는다. trace의 실제 미래 step이 아니라 레시피 계획값만 쓴다(누설 방지)."
        targets: "미래값 예측 VG11, APC (그다음 8개 전부)"
        metric: "검증 MAE, 사이클 밖 MAE"
        success: "교차검증에서 1단계 최고 설정보다 나음"
        cost: "코드 수정(미래 구간 임베딩) + 대상별 탐색 100 trial"
        prerequisite: "X2"
        risk: "조건을 기다리는 step(압력·온도 도달 대기)은 길이가 run마다 달라 계획값이 틀릴 수 있다."
      - id: N3
        title: 학습형 주기 template (CycleNet식)
        goal: "레시피 평균 기준선을 학습하는 주기 패턴 표로 바꿔 모델 안으로"
        priority: 1
        status: 계획
        question: "사이클의 위상별 패턴을 모델이 직접 학습하면 지금의 레시피 평균 + step 규칙보다 나은가?"
        evidence:
          - "CycleNet 원문: PatchTST에 붙이면 전력 MSE 9~19% 감소, 교통은 0.5~2% 증가. 주기를 틀리게 주면 효과가 사라짐(우리는 78점으로 정확히 앎)."
          - "지금 성능의 일부는 모델이 아니라 규칙(값이 일정한 구간에서 레시피 평균)이다."
        variants:
          - [지금, "레시피 평균 기준선 + 보정량 학습 + step 규칙", "기준"]
          - [RCF, "학습형 패턴 표(사이클 위상 + step별 칸)", ""]
        method:
          - "공식 코드는 행 번호로 위상을 잡으므로 step 기록으로 위상(0~77)을 계산해 넘긴다. 이상 run은 패턴 학습에서 뺀다."
        targets: "가상 센서 가스·밸브·APC·VG11"
        metric: "교차검증 MAE"
        success: "교차검증에서 1단계 최고 설정 + step 규칙보다 나음"
        cost: "코드 반나절 + 대상별 학습"
        prerequisite: "X4"
        risk: "사이클 길이가 샘플 단위로 흔들리면 위상 오차가 쌓인다."
      - id: N4
        title: 계열 가림 다중 과제 (가상 센서 16개를 모델 하나로)
        goal: "학습 중 신호 계열을 무작위로 가려 하나의 모델이 모든 가상 센서를 맡는다"
        priority: 2
        status: 계획
        question: "대상끼리 학습을 나눠 가지면 대상별 모델보다 나은가?"
        evidence:
          - "GgNet 원문: 기후 데이터 MRE 13.4%, 차점 15.5%. 지점이 20개로 적으면 오히려 나빠짐(455 대 451)."
        variants:
          - [대상별, "지금", "기준"]
          - [하나로, "계열 단위로 가려 학습한 모델 하나", ""]
        method:
          - "채널이 아니라 계열 단위로 가려야 거의 같은 센서(PressAct와 VG11)를 베끼지 않는다."
        targets: "가상 센서 16개"
        metric: "교차검증 MAE (대상별)"
        success: "대상 다수에서 대상별 모델과 같거나 나음"
        cost: "코드 하루 + 학습"
        prerequisite: "N1 (인코더 공유)"
        risk: ""
  - key: vm
    title: 두께 예측 (병행, CPU)
    why: "Ex-situ가 58개 run뿐이고, 시간순 평가에서 trace 요약 모델이 앞 run 측정값의 EWMA를 넘지 못했다(1단계 관문 미통과). EWMA가 남긴 차이만 맞히는 모델을 같은 평가로 본다."
    items:
      - id: T1
        title: EWMA 잔차 GP
        goal: "EWMA(0.3)를 살리고 남은 차이만 GP로, 분산이 크면 보정을 줄임"
        priority: 2
        status: 계획
        question: "GP가 EWMA가 남긴 차이를 시간순 평가에서 맞히는가?"
        evidence:
          - "Han 외(IEEE TSM 2025, 공개 CMP, 시간순): 온라인 GP MSE 11.57, EWMA 19.63(41% 낮음)."
          - "Wan·McLoone(2018): GP 예측 분산으로 EWMA 반영 계수를 줄이는 방식. 'EWMA + GP 잔차'는 우리 설계안이다."
        variants:
          - [EWMA, "앞 run 측정값의 EWMA(0.3)", "기준"]
          - [GP, "EWMA + GP(SE + 잡음, 입력은 중요도 A 요약 3~5개 + 직전 측정값)", ""]
          - [GP+분산, "분산이 크면 보정량을 줄임 (Wan 방식)", ""]
        method:
          - "vm_stage1과 같은 시간순 평가(앞 run만으로 학습, 20개부터). 하이퍼파라미터는 run마다 주변우도 최대화."
        targets: "두께, U/F, WtoW"
        metric: "EWMA 대비 MAE 개선, 표준오차 2배 판정"
        success: "EWMA보다 표준오차 2배 넘게 나음 (1단계 관문)"
        cost: "CPU 수십 분"
        prerequisite: ""
        risk: "입력에 드러나지 않는 흐름은 GP 분산이 잡지 못한다."
      - id: T2
        title: TabPFN v2
        goal: "표 데이터 기반 모델로 EWMA 잔차를 예측"
        priority: 2
        status: 계획
        question: "run 20~57개, 특성 460개에서도 TabPFN이 EWMA가 남긴 차이를 맞히는가?"
        evidence:
          - "원문(Nature 2025): 샘플 1만·특성 500개 이하 회귀 28개에서 기본 설정이 4시간 튜닝한 기준선보다 정확. 극소표본은 검증되지 않음."
          - "v2 가중치는 상업 사용 가능, 2.5는 금지."
        variants:
          - [①, "EWMA 값 + run 순번", ""]
          - [②, "① + 학습 run으로 고른 특성 20~30개", ""]
          - [③, "특성 460개 전부", ""]
        method:
          - "T1과 같은 시간순 평가. 예측 분포의 10~90% 구간 포함률도 본다."
        targets: "두께, U/F, WtoW"
        metric: "T1과 같음"
        success: "T1과 같음"
        cost: "CPU (가중치 내려받기 필요)"
        prerequisite: "서버에서 가중치 내려받기 가능 여부"
        risk: "사전학습 특성 수(160개 이하)보다 많아 ③은 불리할 수 있다."
      - id: T3
        title: 5개 WAP 다중 과제 회귀
        goal: "웨이퍼 위치 5곳의 두께를 같은 특성으로 함께 학습"
        priority: 3
        status: 계획
        question: "WAP 5곳이 특성을 공유하면 따로 학습할 때보다 나은가?"
        evidence:
          - "CBCT(IEEE TSM 2023)는 '같은 출력의 여러 운전 상태(32개)'를 함께 학습해 오차 52~79% 감소. 상태가 4개면 32개 대비 오차 57% 증가."
        variants:
          - [따로, "WAP별 모델", "기준"]
          - [함께, "MultiTaskElasticNet (특성 공유)", ""]
        method:
          - "EWMA를 넘지 못하면 CBCT 구현은 보류한다."
        targets: "WAP 1~5 두께"
        metric: "T1과 같음"
        success: "T1과 같음"
        cost: "CPU 수 분"
        prerequisite: ""
        risk: "WAP가 5개뿐이라 공유 효과가 작을 수 있다."
