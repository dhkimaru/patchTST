# 다음 실험 후보 — 보고서 "다음 실험" 탭의 원본.
# 집계 수치와 설명만 적는다 (회사 원본 데이터·시점별 값 금지).
# status: 계획 | 진행 중 | 완료 | 보류      priority: 1 (먼저) ~ 3
# goal: 카드에 보이는 한 줄 목표. variants_title: 비교 표 제목 (기본 "비교할 설정", 하이퍼파라미터는 "탐색 공간").
# 근거(evidence)의 숫자는 basis에 적은 보고서 기준이다. 실험이 끝나면 status와 result를 고친다.
# 컬럼 사전의 중요도 등급은 현업 자료 그대로 확정이다 (등급이 없는 압력계·APC·RF 매칭 위치도 자료 그대로).
as_of: "2026-10-27"
basis: "최종 보고서 2026-10-27 14:54 (실험 5개 · 모델 270개)"
principles:
  - "입력·과제를 바꾸는 실험은 같은 분할·같은 기준선의 기준 실험과 나란히 비교한다."
  - "하이퍼파라미터는 하나씩 바꾸지 않고 탐색 공간 전체를 조합으로 함께 최적화한다 — 설정끼리 영향을 주고받는다."
  - "넓게 거를 때는 검증 run · seed 1개, 상위 후보만 seed 3개로 다시 돌려 seed 편차와 비교한다."
  - "시험 run은 최종 후보에서만 연다. 시험 결과를 보고 설정을 바꾸지 않는다."
categories:
  - key: input
    title: 입력 · 특징
    why: "지금까지 가장 큰 개선은 모델보다 입력에서 나왔다 (같은 LightGBM, 신호 37개 → 163개로 시험 run 오차 44 % 감소)."
    items:
      - id: A1
        title: Step 타이밍을 미래에도 아는 값으로 입력
        goal: "step 전환 직후의 큰 오차를 레시피 일정 정보로 줄인다"
        priority: 1
        status: 계획
        question: "모델이 '지금 step이 몇 초 뒤 끝나는지'를 알면 step 전환 직후의 큰 오차가 줄어드는가? 레시피 일정을 미리 알면 얼마나 얻는가?"
        evidence:
          - "VG11 예측 LightGBM: step 전환 직후(10초 안) 오차가 안정 구간의 2.6배. RF 반사 파워 예측은 31.8배."
          - "이전 GS1(Step ID 임베딩만 추가)은 개선 없음(0.188 → 0.213, 불분명). 빠진 정보는 step의 종류보다 타이밍으로 보임."
          - "레시피는 미리 정해져 있어, 다음 step까지 남은 시간은 실제 장비에서도 미리 알 수 있는 값이다."
        variants:
          - [S0, "추가 없음 (지금)", "기준"]
          - [S1, "현재 step ID + step 경과 시간", "지금 위치만 앎"]
          - [S2, "S1 + 레시피 공칭 길이로 계산한 다음 step까지 남은 시간 + 다음 step ID", "레시피를 미리 앎"]
          - [S3, "S2 + 예측 시점(10·20·30초 뒤)의 step ID·경과 시간", "미래 일정을 앎"]
          - [S4, "실제 남은 시간 (기록에서 계산)", "상한선 — 배포 불가"]
        method:
          - "step별 실제 길이의 run 간 편차를 재서, 시간이 정해진 step과 조건을 기다리는 step(압력·온도 도달 대기)을 자동으로 나눈다."
          - "공칭 길이는 학습 run의 step별 길이 중앙값."
          - "LightGBM: 요약 특징 옆에 타이밍 특징을 붙인다. 딥러닝: 입력 채널로 붙이고, S3는 출력층에 미래 값으로 넣는다."
        targets: "VG11 (신호 37개·163개), AUXMon_R.PWR, APCValveMon"
        metric: "전체 MAE + 'step 전환 직후 10초' MAE"
        success: "S2가 S0보다 전환 직후 MAE를 seed 편차의 2배 넘게 줄이면 채택"
        cost: "코드 반나절 + 실행 1시간"
        prerequisite: ""
        risk: "S4는 실제 기록을 쓰므로 배포 성능으로 보고하면 안 된다(상한선으로만)."
      - id: A2
        title: LightGBM 요약 특징 확장
        goal: "window 요약에서 버린 시간 순서 정보를 되살린다"
        priority: 2
        status: 계획
        question: "window를 6개 요약값으로 줄이면서 버린 시간 순서 정보를 되살리면 나아지는가?"
        evidence:
          - "지금 특징은 신호마다 마지막·평균·표준편차·최소·최대·(마지막−중간) 6개. window 안의 시간 순서는 거의 없다."
          - "그런데도 LightGBM이 대부분 대상에서 1등 (VG11 시험 run 0.074 Torr)."
        variants:
          - [F0, "지금 6개", "기준"]
          - [F1, "+ 최근 5초 값 5개", "직전 움직임"]
          - [F2, "+ 기울기(최근 16·64초 직선 맞춤)", "추세"]
          - [F3, "+ 16·64·192초 다중 구간 평균·표준편차", "여러 시간 규모"]
        method:
          - "특징이 늘어나 학습 시간이 커지므로 신호 수가 많은 실험(163개)은 B2의 권장 입력 세트와 함께 쓴다."
        targets: "VG11, APCValveMon, MFCMon_P.POS"
        metric: "검증 MAE, 사이클 안 MAE"
        success: "F1~F3 중 하나가 F0보다 seed 편차 2배 넘게 좋으면 기본값 변경"
        cost: "코드 수 시간 + 실행 30분"
        prerequisite: ""
        risk: "특징 수가 커지면 메모리·시간이 늘어난다 (학습 window 30만 개 × 특징 수)."
  - key: importance
    title: 중요도 A 등급 활용
    why: "현업이 중요도 A로 정한 신호는 62개인데, 지금은 그중 대표 14개(core)만 시험했다. core만 쓰면 전체 입력보다 평균 약 34 % 나빠졌다. A 등급을 더 잘 쓰면 신호를 적게 쓰면서도 전체 입력 수준의 성능을 낼 수 있는지 본다."
    items:
      - id: B1
        title: A 등급 전체 사용
        goal: "대표 14개 → A 등급 62개로 넓혀 전체 입력과의 차이를 메운다"
        priority: 1
        status: 계획
        question: "같은 파라미터의 다른 측정점(zone별 열전대, MFC 설정·측정 등)까지 A 등급을 모두 쓰면 core와 전체 입력의 차이를 얼마나 메우는가?"
        evidence:
          - "핵심 vs 전체 (대상 4 × 모델 3 평균): 전체 → core −34 %, 전체 → core_ab −28 %."
          - "core는 A 등급 파라미터마다 대표 컬럼 1개만 골라 14개다 (A 등급 컬럼은 62개)."
          - "대상별 차이가 크다: L.POS는 core로 줄이면 2배 이상 나빠지고, VG11 가상 센서는 거의 같다."
        variants:
          - [core, "A 대표 14개", "지금 결과 있음"]
          - [A_all, "A 등급 62개 전체", "새로 만듦"]
          - [A_plus, "A 62개 + 등급 없는 압력계·APC·RF 매칭 위치", "등급 밖 신호의 몫"]
          - [all, "전체 164개", "지금 결과 있음"]
        method:
          - "입력 세트 A_all(62개)·A_plus(74개)는 준비됨 — 대시보드 3. 하이퍼파라미터·학습 → ① 새 실험 실행에서 기준 실험 g3_core_vs_all, 입력 세트 all·core·A_all·A_plus로 바로 돌린다."
          - "가상 센서 4개 대상 × LightGBM·iTransformer, seed 2개 — 지금 '핵심 vs 전체' 실험과 같은 조건."
        targets: "가상 센서 VG11 · TempAct_C · APCValveMon · MFCMon_L.POS"
        metric: "검증 MAE, 전체 입력 대비 차이(%)"
        success: "A_all이 전체 입력과 seed 편차 안이면 'A 등급만으로 충분'으로 결론"
        cost: "실행 30분 (입력 세트 코드는 준비됨)"
        prerequisite: ""
        risk: "가상 센서는 대상과 같은 계열·복사본을 빼는 규칙이 그대로 적용되어, 대상마다 실제 입력 수가 조금 다르다."
      - id: B2
        title: A 등급에서 출발해 신호 더하기 (권장 입력 세트)
        goal: "A 등급 + 몇 개면 전체 입력 성능에 닿는지 — 가장 작은 입력 세트"
        priority: 2
        status: 계획
        question: "A 등급에서 시작해 기여가 큰 신호를 차례로 더할 때, 몇 개에서 전체 입력과 같아지는가?"
        evidence:
          - "전체 164개는 학습·추론 비용이 크고, 현장에서 관리하기 어렵다."
          - "LightGBM은 신호 37개 → 163개로 늘리자 시험 오차 44 % 감소 — 어떤 신호가 기여했는지는 아직 모른다."
        variants:
          - [A, "A 등급만", "출발점"]
          - [A+k, "A + 기여 상위 k개 (k = 5 · 10 · 20 · 40)", "차례로 더하기"]
          - [all, "전체", "상한"]
        method:
          - "더하는 순서는 B4의 모델 중요도(계열 단위 permutation)로 정한다."
          - "입력 수 대비 오차 곡선을 그려 더해도 나아지지 않는 지점을 찾는다."
        targets: "B1과 같음 + VG11 예측"
        metric: "검증 MAE vs 입력 신호 수"
        success: "전체와 seed 편차 안에 드는 가장 작은 세트를 '권장 입력 세트'로 제안"
        cost: "약 1~2시간 (LightGBM 위주)"
        prerequisite: "B4 (기여 순서)"
        risk: "같은 검증 run으로 신호를 고르고 평가하면 낙관적 → 최종 세트는 시험 run으로 확인."
      - id: B3
        title: A 등급 신호를 모델에 우선 반영
        goal: "입력은 그대로, A 등급을 더 비중 있게 쓰는 구조"
        priority: 2
        status: 계획
        question: "전체 신호를 넣되 A 등급 신호를 모델이 더 잘 쓰도록 구조를 바꾸면 성능이 좋아지는가?"
        evidence:
          - "지금은 모든 신호를 같은 비중으로 넣는다."
          - "딥러닝은 신호가 많아지면 오히려 나빠진 경우가 있다 (PatchTST 신호 37 → 163개: 0.204 → 0.315)."
        variants:
          - [W0, "모든 신호 같은 비중 (지금)", "기준"]
          - [W1, "2단계: A 등급으로 먼저 예측 → 나머지 신호로 남은 오차 보정", "LightGBM · Ridge"]
          - [W2, "A 등급에만 요약 특징을 더 많이 (기울기·다중 구간), 나머지는 기본 6개", "LightGBM"]
          - [W3, "A 등급 / 나머지를 따로 인코딩해 합침 (두 갈래 입력)", "딥러닝"]
        method:
          - "입력 신호는 전체로 고정하고 구조만 바꾼다 (B1과 겹치지 않게)."
        targets: "VG11 예측, 가상 센서 TempAct_C · MFCMon_L.POS"
        metric: "검증 MAE"
        success: "W0보다 seed 편차 2배 넘게 좋으면 채택"
        cost: "코드 반나절~1일 + 실행 1시간"
        prerequisite: ""
        risk: "구조가 복잡해지면 설명이 어려워진다 — 개선 폭이 작으면 단순한 쪽을 남긴다."
      - id: B4
        title: 모델이 쓰는 신호 vs 중요도 등급 대조
        goal: "모델 중요도 상위 신호 중 A 등급 비율과, 등급 밖 핵심 신호를 찾는다"
        priority: 1
        status: 계획
        question: "모델 중요도 상위 신호 중 A 등급은 몇 %인가? A 등급인데 거의 안 쓰이는 신호, 등급이 없는데 많이 쓰이는 신호는 무엇인가?"
        evidence:
          - "LightGBM이 거의 모든 대상에서 1등이라 중요도를 바로 뽑을 수 있다."
          - "압력계·APC 밸브·RF 매칭 위치는 등급이 없어 core에 들어가지 않았다 — 실제 기여는 아직 재지 않았다."
        variants:
          - [gain, "LightGBM gain 중요도", "빠름"]
          - [perm, "계열 단위 permutation 중요도 (같은 계열을 함께 섞음)", "상관 신호에 강함"]
        method:
          - "대상별 상위 20개 신호를 A · B · C · 등급 없음으로 나눠 비율을 표로 만든다."
          - "보고서에 '모델 중요도 vs 등급' 표를 추가한다."
        targets: "파라미터 예측 8개, 가상 센서 16개, VG11 예측"
        metric: "상위 20개 중 A 등급 비율, 등급별 평균 중요도"
        success: "B1·B2 입력 세트 설계에 바로 쓰고, 등급 밖 핵심 신호 목록을 현업과 공유"
        cost: "코드 반나절 + 실행 30분"
        prerequisite: ""
        risk: "상관이 큰 신호끼리는 중요도가 나뉘어 작게 보인다 → 계열 단위로 해석."
  - key: hparam
    title: 하이퍼파라미터 조합 최적화 — PatchTST 우선
    why: "연구의 주 모델은 PatchTST다. 지금까지는 모델 9종을 처음부터 나란히 비교해 PatchTST는 대상마다 설정 하나로만 학습됐다 (VG11만 d_model·patch 일부). PatchTST의 조합을 먼저 충분히 탐색해 모든 대상에 적용하고, 그래도 기준을 못 넘는 대상만 다른 모델로 푼다. 설정끼리 영향을 주고받으므로 하나씩 바꾸지 않고 조합으로 탐색한다."
    items:
      - id: C2
        title: 모델 선정 단계 — PatchTST 탐색 → 전체 적용 → 대안
        goal: "모든 대상을 PatchTST로, 조합을 탐색해 최고 설정을 찾고 안 되는 대상만 다른 모델"
        priority: 1
        status: 진행 중
        question: "PatchTST 하이퍼파라미터 조합을 충분히 탐색하면 몇 개 대상에서 기준선을 seed 편차 2배 넘게 이기는가? 못 이기는 대상은 어떤 모델이 대안인가?"
        evidence:
          - "지금 PatchTST는 파라미터 예측 8개·가상 센서 16개에서 설정 1개 · seed 1개로만 학습됐다."
          - "PatchTST 혼합: 신호 37개 0.204 → 163개 0.315로 오히려 나빠짐 (고정 설정) — 입력 세트도 함께 본다."
          - "epoch 상한에 닿음: VG11 PatchTST(60 중 58번째가 최고)."
        variants_title: 탐색 공간
        variants:
          - [신호 처리, "신호별 독립 · 신호 혼합", "channel_mode"]
          - [patch 길이 · 간격, "8 · 16 · 32초 / 4 · 8 · 16초 (가상 센서는 절반)", ""]
          - [d_model · head, "64 · 128 · 256 / 4 · 8 · 16", "나누어떨어지는 조합만"]
          - [층 수 · d_ff, "2 ~ 4 / 128 · 256 · 512", ""]
          - [dropout · 학습률, "0 ~ 0.2 / 3e-4 · 1e-3 · 2e-3", ""]
          - [RevIN 기준, "평균 · 마지막 값", "예측만"]
          - [입력 세트, "전체 164개 · A_plus 74개", "같은 조합으로 둘 다"]
        method:
          - "1단계 탐색: 대표 대상 3개(예측 VG11·APC·L.POS / 가상 센서 VG11·TempAct_C·L.POS)에서 조합 16개를 무작위로 뽑아 짧게 학습 (epoch 15 · window 10만) — configs/experiments/p1_patchtst_search_*.yaml."
          - "2단계 전체 적용: 대상별 최고 조합 대비 상대 MAE를 평균한 순위로 상위 3개 조합을 골라 모든 대상(예측 8개 · 가상 센서 16개)에 정식 학습, seed 3개 — `ald-queue stage2` 또는 대시보드 버튼."
          - "3단계 대안: PatchTST 최고가 기준선을 seed 편차 2배 넘게 이기지 못한 대상만 iTransformer · DLinear · LightGBM — `ald-queue stage3`. LightGBM과의 차이는 참고로만 본다."
          - "window 길이는 실험 단위 설정이라 대시보드에서 값을 여러 개 넣으면 실험이 window마다 하나씩 대기열에 들어간다."
        targets: "1단계 대표 6개 → 2단계 예측 8개 · 가상 센서 16개"
        metric: "검증 MAE · 대상별 판정 (PatchTST 채택 / 대안)"
        success: "PatchTST 채택 대상 수와, 대안 대상의 이유(기준선보다 나쁨 / 차이가 seed 흔들림 안)를 표로 보고 (LightGBM 대비는 참고)"
        cost: "1단계 GPU 4장 약 2~3시간 (예측·가상 센서 각각), 2단계 반나절"
        prerequisite: "준비됨 — 대시보드(HTML) 하이퍼파라미터 탐색 탭, ald-queue stage2/stage3"
        risk: "1단계는 짧은 학습이라 순위만 본다 — 결론은 2단계 정식 학습 결과로. 검증 run에 과하게 맞추지 않도록 최종 비교는 시험 run."
      - id: C1
        title: LightGBM 조합 최적화 (대안 단계에서만)
        goal: "PatchTST가 기준을 못 넘은 대상에서 LightGBM이 대안이 될 때만 조합을 최적화한다"
        priority: 3
        status: 계획
        question: "기본값 대신 대상별로 최적화한 조합을 쓰면 얼마나 좋아지는가? 대상마다 최적 조합이 다른가, 공통 조합 하나로 충분한가?"
        evidence:
          - "LightGBM이 VG11·온도·P.POS 예측과 가상 센서 대부분에서 1등인데 기본값만 썼다."
          - "학습 window 약 80만 개 중 30만 개만 쓴다 — 표본 수도 탐색 대상이다."
        variants_title: 탐색 공간
        variants:
          - [num_leaves, "15 ~ 255 (로그)", "잎 수"]
          - [learning_rate, "0.01 ~ 0.2 (로그)", "학습률"]
          - [min_child_samples, "20 ~ 1000 (로그)", "잎 최소 샘플"]
          - [colsample_bytree, "0.2 ~ 1.0", "나무마다 쓰는 특징 비율"]
          - [subsample, "0.5 ~ 1.0", "나무마다 쓰는 행 비율"]
          - [reg_lambda, "0 ~ 10", "L2 규제"]
          - [학습 window 수, "30만 · 50만 · 80만(전체)", "표본 수"]
          - [objective, "l2 · l1 · huber", "손실"]
        method:
          - "베이지안 최적화(Optuna TPE)로 대상당 100회 시도. 반복 수는 검증 조기 종료로 자동."
          - "가지치기: 중간 검증 손실이 나쁜 시도는 일찍 멈춰 시간을 줄인다."
          - "대상별 최적 조합 vs 모든 대상 공통 조합(평균 순위 1등)을 비교한다."
          - "상위 3개 조합만 seed 3개로 다시 돌려 기본값과 비교한다."
        targets: "VG11 예측(37·163개), 파라미터 예측 8개, 가상 센서 상위 대상"
        metric: "검증 MAE (최종 후보만 시험 run)"
        success: "기본값보다 seed 편차 2배 넘게 좋으면 기본값을 대상별(또는 공통) 최적 조합으로 교체"
        cost: "CPU 병렬, 대상당 20~40분 → 전체 반나절"
        prerequisite: "C2 3단계 판정 (대안 대상이 정해진 뒤)"
        risk: "시도를 많이 할수록 검증 run에 과하게 맞출 수 있다 — 최종 비교는 시험 run으로."
      - id: C3
        title: 조합 탐색 결과 분석 — 무엇이 왜 중요한가
        goal: "설정별 중요도와 함께 맞춰야 하는 설정 쌍을 정량화"
        priority: 2
        status: 계획
        question: "성능을 좌우하는 설정은 무엇이고, 어떤 설정끼리 함께 맞춰야 하는가? 하나씩 바꾼 결과(patch 길이 '불분명' 등)와 무엇이 다른가?"
        evidence:
          - "이번 탐색은 d_model 2 × patch 2 격자뿐이라 설정 사이의 상호작용을 볼 수 없었다."
          - "이전 실험은 하나씩 누적(A01~A09)이라 정규화가 무너진 뒤의 효과를 해석할 수 없었다."
        variants_title: 분석
        variants:
          - [중요도, "설정별 중요도 — 성능 차이를 설정·설정 쌍으로 나눔 (fANOVA)", ""]
          - [상호작용, "중요한 설정 쌍의 2차원 지도 (예: d_model × 학습률)", ""]
          - [방법 비교, "같은 시도 수에서 격자 · 무작위 · 베이지안의 최고 성능", "탐색 방법의 효율"]
        method:
          - "C2의 시도 기록(설정·검증 MAE)만으로 계산한다 — 추가 학습 없음. 1차 버전은 대시보드 '설정 값별 MAE' 그림."
          - "Hyper Parameter 탭에 설정 중요도 막대와 상호작용 지도를 넣는다."
        targets: "C1 · C2와 같음"
        metric: "설정별 중요도(%), 상위 상호작용 쌍"
        success: "다음 탐색 공간을 좁히는 근거로 쓴다 (중요도 낮은 설정은 고정)"
        cost: "코드 반나절"
        prerequisite: "C2 1단계 결과 (시도 기록만으로 계산)"
        risk: "시도 수가 적으면 중요도 추정이 불안정 — 모델당 50회 이상에서 해석."
  - key: task
    title: 과제 정의
    why: "지금 과제 설정 일부는 현실 조건보다 극단적이거나 현장 용도와 다르다."
    items:
      - id: D1
        title: VG11 가상 센서 — 압력계 하나만 고장
        goal: "주 압력계만 고장 난 현실 조건에서의 추정 정확도"
        priority: 2
        status: 계획
        question: "주 압력계(VG11)만 고장 나고 다른 압력계는 살아 있을 때 얼마나 정확한가?"
        evidence:
          - "지금은 압력계 9개를 모두 뺀 극단 조건: 레시피 평균 대비 +26 % (1.553 Torr)."
          - "사전 분석(ald-analyze-params): 다른 압력계가 있으면 잔차의 약 95 %가 설명된다."
        variants:
          - [P0, "압력계 9개 모두 제외 (지금)", "기준"]
          - [P1, "VG11과 그 복사본(PressAct·AUXMon_VG11)만 제외", "주 게이지 고장"]
        method: ["실험 설정에서 계열 제외 대신 제외 목록을 직접 지정한다."]
        targets: "VG11"
        metric: "검증 MAE, 사이클 안 MAE"
        success: "P1의 레시피 평균 대비 개선이 P0보다 크게 늘어나는지"
        cost: "약 20분"
        prerequisite: ""
        risk: ""
      - id: D2
        title: 예측 거리 늘리기 (60 · 120초)
        goal: "1~2분 전 예측이 이상 감지에 쓸 만한지"
        priority: 3
        status: 계획
        question: "이상 감지에 쓸 만큼 미리(1~2분 전) 예측할 수 있는가?"
        evidence:
          - "VG11 시험 run 오차: 10초 0.048 → 20초 0.076 → 30초 0.099 Torr (신호 163개 LightGBM)."
        variants:
          - [H, "10 · 30 · 60 · 120초", ""]
        method: ["먼 미래는 긴 window가 유리할 수 있어 C2의 window 탐색 결과와 함께 본다."]
        targets: "VG11, APCValveMon"
        metric: "예측 거리별 MAE, 현재값 유지 대비 개선율"
        success: "120초에서도 현재값 유지 대비 의미 있는 개선이 유지되는지"
        cost: "약 1시간"
        prerequisite: ""
        risk: ""
      - id: D3
        title: 앙상블 · 구간별 모델
        goal: "강한 구간이 다른 두 모델을 섞어 쓴다"
        priority: 2
        status: 계획
        question: "LightGBM과 딥러닝을 섞거나 구간별로 나눠 쓰면 더 좋아지는가?"
        evidence:
          - "신호 37개 조건: 사이클 안은 PatchTST 0.099, 전체는 LightGBM 0.132 (시험 run). 강한 구간이 다르다."
          - "L.POS: 검증은 iTransformer 1등, 시험 run은 LightGBM이 근소하게 앞섬."
        variants:
          - [E1, "두 모델 평균", ""]
          - [E2, "검증 run으로 정한 가중 평균", ""]
          - [E3, "구간별 선택 (사이클 안 / 그 외)", ""]
        method: ["새 학습 없이 저장된 예측으로 계산한다 (검증 run 전체 예측 저장 필요)."]
        targets: "VG11, MFCMon_L.POS, APCValveMon"
        metric: "검증 MAE"
        success: "단일 최고 모델보다 seed 편차 2배 넘게 좋으면 패키지에 앙상블 추가"
        cost: "코드 반나절 + 실행 수 분"
        prerequisite: "검증 run 전체 예측 저장 (지금은 예시 run만 저장)"
        risk: "가중치를 검증 run으로 정하면 검증 점수가 낙관적 → 시험 run으로 확인."
  - key: anomaly
    title: 이상 감지 검증
    why: "과제의 원래 목적(이상 감지)에 실제로 쓸 수 있는지 아직 직접 확인하지 않았다."
    items:
      - id: E1
        title: 예측 오차 · 가상 센서 오차를 이상 점수로
        goal: "알려진 이상 run을 오경보 없이 구분하는지"
        priority: 1
        status: 계획
        question: "정상 run과 알려진 이상 run에서 오차 분포가 구분되는가?"
        evidence:
          - "P.POS 예측 오차가 055(통신 끊김 알람 run)에서 다른 run 중앙값의 8.8배."
          - "알려진 이상 run: 055(통신 끊김), 057·001·002(두께 이상). 071은 분할에서 제외."
        variants:
          - [score1, "예측 잔차 (실측 − 10초 뒤 예측)", ""]
          - [score2, "가상 센서 잔차 (실측 − 추정)", "센서 드리프트·고장"]
        method:
          - "run별·시점별 잔차를 모아 정상 run의 분포(분위수)로 경계를 정하고, 이상 run이 그 밖으로 나가는지 본다."
          - "학습 run에 있는 이상 run(001·002)은 그 run을 뺀 모델로 점수를 다시 계산한다."
        targets: "VG11, MFCMon_P.POS, APCValveMon, TempAct 계열"
        metric: "이상 run 탐지율, 정상 run 오경보율"
        success: "알려진 이상 run을 오경보 없이 구분하면 경계값과 함께 활용안으로 보고"
        cost: "코드 반나절~1일"
        prerequisite: ""
        risk: "이상 run이 4~5개뿐이라 통계적 결론은 어렵다 — 사례 보고 수준으로 정리."
      - id: E2
        title: 알람 선행 신호
        goal: "알람 전에 이상 점수가 먼저 오르는지"
        priority: 3
        status: 계획
        question: "알람(예: 055 통신 끊김) 전에 이상 점수가 먼저 오르는가?"
        evidence:
          - "055는 사이클 도중 멈춤."
        variants:
          - [lead, "알람 전 5 · 30 · 60초 구간의 점수", ""]
        method: ["알람 시각은 Ex-situ 기록에서 확인한다."]
        targets: "E1과 같음"
        metric: "알람 전 점수 상승 여부"
        success: "선행 시간이 일관되면 경보 규칙 후보"
        cost: "E1 이후 수 시간"
        prerequisite: "E1"
        risk: ""
  - key: vm
    title: 두께 예측 (VM)
    why: "표본(run)이 58개뿐인데 특징이 460개라 과적합 위험이 크고, 개선이 17 %에 그쳤다."
    items:
      - id: F1
        title: 물리 기반 특징으로 줄이기
        goal: "공정 지식으로 만든 특징 20~40개 vs 통계 특징 460개"
        priority: 2
        status: 계획
        question: "공정 지식으로 만든 특징 20~40개가 통계 특징 460개보다 나은가?"
        evidence:
          - "LightGBM 두께 +17.2 %, U/F +17.3 %, WtoW +28.9 % (58 run 교차검증)."
          - "Ridge는 입력이 적은 core_ab에서 더 좋았다 (두께 0.249 vs 0.268)."
        variants:
          - [phys, "SI-FL1 DCS 유량 적산, NH3 플라즈마 RF 에너지, 사이클 중 zone별 온도, DCS 방출 시 압력, 사이클 수, 공정 시간", ""]
        method: ["Ridge·PLS·LightGBM에서 각각 비교한다."]
        targets: "thk_mean, uf_pct_mean, wtow_pct"
        metric: "leave-one-run-out MAE"
        success: "460개 특징보다 같거나 좋으면 해석이 쉬운 쪽을 기본으로"
        cost: "특징 코드 1일 + 실행 수 분"
        prerequisite: ""
        risk: ""
      - id: F2
        title: boat 위치(WAP)별 두께를 대상으로
        goal: "위치 5곳을 따로 맞혀 표본을 5배로"
        priority: 2
        status: 계획
        question: "run 평균 하나 대신 위치 5곳의 두께를 맞히면 표본이 5배(290개)가 되어 안정적인가?"
        evidence:
          - "Ex-situ 49점 측정에는 WAP 5곳의 웨이퍼별 두께가 있다 (지금은 평균 하나만 씀)."
        variants:
          - [wap, "WAP 위치를 특징으로 넣고 위치별 두께 예측", ""]
        method: ["교차검증은 run 단위로 묶어 같은 run의 위치가 학습·평가에 섞이지 않게 한다."]
        targets: "WAP 1~5 두께 → 평균·WtoW 재계산"
        metric: "run 단위 MAE"
        success: "run 평균 직접 예측보다 좋으면 채택"
        cost: "약 1일"
        prerequisite: ""
        risk: "같은 run의 위치끼리는 독립이 아니다 — run 단위 분할 필수."
      - id: F3
        title: 사이클 수가 다른 두 그룹 비교
        goal: "사이클 수가 다른데 두께가 비슷한 이유를 데이터로"
        priority: 3
        status: 계획
        question: "사이클 수가 다른데 두께가 비슷한 이유를 데이터로 설명할 수 있는가?"
        evidence:
          - "run 1~10과 11 이후는 사이클 수(LOOP 설정)가 다르다. 그런데 003~010과 11 이후의 두께는 비슷하다."
        variants:
          - [group, "두 그룹의 사이클당 증착량·조건 비교", ""]
        method: ["사이클당 두께(두께 ÷ 사이클 수)를 비교하고 조건 신호 차이를 본다."]
        targets: "분석 (모델 아님)"
        metric: "사이클당 두께, 조건 차이"
        success: "원인 후보를 정리"
        cost: "수 시간"
        prerequisite: ""
        risk: ""
  - key: reliability
    title: 신뢰도 · 검증 방법
    why: "결론을 단정하려면 반복 실험과 통계 검정, 검증 방식 점검이 더 필요하다."
    items:
      - id: G1
        title: 최종 후보 seed 3개 재실행
        goal: "1·2등 차이가 작은 대상의 순위가 seed에 흔들리는지"
        priority: 2
        status: 계획
