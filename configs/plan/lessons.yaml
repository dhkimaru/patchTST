# 요약 탭 '현재 결론'의 "모델을 만들며 확인한 점". 자동 집계가 아니라 차수가 끝날 때 README와 함께 직접 고친다.
# 신호(컬럼) 이름 대신 쉬운 이름을 쓰고, 한 항목에 한 가지만 짧게 적는다 (tests/test_report_overview.py가 확인).
as_of: 11-17, 1~633차
points:
  - title: 성능을 가장 크게 바꾼 것
    text: 모델 구조보다 데이터를 넣는 방식. 1초 평균 대신 0.5초 원본을 쓰고 사이클 구간 전용 모델을 함께 쓰자 가스·밸브 오차가 직전 최선보다 16~57% 더 감소
  - title: 효과가 컸던 학습 설정
    text: 손실 함수(MSE → MAE), 학습량(120 epoch), 층 수와 대상별 window 길이. 하나씩 바꿀 때마다 미래값 예측 오차 14~17% 감소
  - title: 검증 방식
    text: 검증 점수만으로는 새 run 성능을 보장할 수 없음. 처음 시험 run에서 가스·밸브 오차가 검증의 최대 2.2배였고, 교차검증과 run별 분석으로 원인(1초 평균)을 찾아 0.4~1.2배로 낮춤. 지금은 seed 3개와 교차검증 5묶음으로 판정
  - title: 남은 과제
    text: 챔버 압력은 사이클 밖 구간 오차가 커서 원인 분석 중, RF 반사 전력과 매처 위치는 0.5초 방식 교차검증 중(634~648차), 두께 예측은 run 수가 적어 딥러닝 미적용
