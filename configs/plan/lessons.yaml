# 요약 탭 '현재 결론'의 "모델을 만들며 확인한 점". 자동 집계가 아니라 차수가 끝날 때 README와 함께 직접 고친다.
# 신호(컬럼) 이름 대신 쉬운 이름을 쓰고, 한 항목에 한 가지만 짧게 적는다 (tests/test_report_overview.py가 확인).
as_of: 11-24, 1~654차
points:
  - title: 성능을 가장 크게 바꾼 것
    text: 모델 구조보다 데이터를 넣는 방식. 1초 평균 대신 0.5초 원본과 사이클 구간 전용 모델을 쓰자 가스·밸브 오차가 16~57%, RF 반사 전력과 매처 위치도 18~35% 더 감소
  - title: 효과가 컸던 학습 설정
    text: 손실 함수(MSE → MAE), 학습량(120 epoch), 층 수와 대상별 window 길이. 하나씩 바꿀 때마다 미래값 예측 오차 14~17% 감소
  - title: 검증 방식
    text: 검증 점수만으로는 새 run 성능을 보장할 수 없음. 시험 run 오차가 검증의 최대 2.2배였던 원인(1초 평균)을 교차검증으로 찾아 0.4~1.2배로 낮춤. 두께는 run을 섞어 평가하면 19% 나아 보였지만 시간 순서로 평가하니 차이 없음
  - title: 오차는 구간별로 볼 것
    text: 챔버 압력 오차의 90% 이상이 대기압 근처 구간에서 나옴. 공정 압력 구간에서 레시피 평균을 쓸 곳을 step과 압력 구간 단위로 고르자 레시피 평균보다 15~21% 정확
  - title: 모델이 필요 없는 구간
    text: 대상이 거의 변하지 않는 구간(가스 꺼짐, 밸브 닫힘, 저압 퍼지)에서는 모델이 작은 흔들림만 더함. 이 구간을 레시피 평균으로 바꾸자 5개 대상 오차가 3~9% 더 감소
  - title: 남은 과제
    text: 극한 탐색으로 전환. 1단계 탐색 19개(여러 하이퍼파라미터를 함께 바꾸며 포화까지)를 대시보드에서 넣고 진행과 예상 끝 시각을 본다. 두께 예측은 앞 run 측정값의 이동평균이 남긴 차이를 맞히는 모델로 병행
