# 요약 탭 '현재 결론'의 "모델을 만들며 확인한 점". 자동 집계가 아니라 차수가 끝날 때 README와 함께 직접 고친다.
# 신호(컬럼) 이름 대신 쉬운 이름을 쓰고, 한 항목에 한 가지만 짧게 적는다 (tests/test_report_overview.py가 확인).
as_of: 11-20, 1~650차
points:
  - title: 성능을 가장 크게 바꾼 것
    text: 모델 구조보다 데이터를 넣는 방식. 1초 평균 대신 0.5초 원본과 사이클 구간 전용 모델을 쓰자 가스·밸브 오차가 16~57%, RF 반사 전력과 매처 위치도 18~35% 더 감소
  - title: 효과가 컸던 학습 설정
    text: 손실 함수(MSE → MAE), 학습량(120 epoch), 층 수와 대상별 window 길이. 하나씩 바꿀 때마다 미래값 예측 오차 14~17% 감소
  - title: 검증 방식
    text: 검증 점수만으로는 새 run 성능을 보장할 수 없음. 처음 시험 run에서 가스·밸브 오차가 검증의 최대 2.2배였고, 교차검증과 run별 분석으로 원인(1초 평균)을 찾아 0.4~1.2배로 낮춤. 지금은 seed 3개와 교차검증 5묶음으로 판정
  - title: 오차는 구간별로 볼 것
    text: 챔버 압력 오차의 90% 이상이 대기압 근처 구간(보트 이동, 대기압 복귀)에서 나옴. 같은 계열 압력계를 뺀 입력으로는 이 구간 압력 수준을 알기 어려워, 전체 평균 하나로는 모델을 판단할 수 없음
  - title: 모델이 필요 없는 구간
    text: 대상이 거의 변하지 않는 구간(가스 꺼짐, 밸브 닫힘, 저압 퍼지)에서는 모델이 작은 흔들림만 더함. 이 구간을 레시피 평균으로 바꾸자 5개 대상 오차가 3~9% 더 감소
  - title: 남은 과제
    text: 가상 센서 16개는 최종 구성 확정. 챔버 압력은 공정 압력 구간으로 판정하고 대기압 근처는 따로 표시. 시험 run 확인과 패키지, 두께 예측 데이터 점검이 남음
