[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ald-lab"
version = "0.1.0"
description = "ALD process virtual sensing / virtual metrology lab with an experiment dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "pyarrow>=15,<20",
  "PyYAML>=6.0,<7",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dashboard = [
  "streamlit>=1.40,<2",
  "plotly>=5.20,<7",
]
train = [
  # The GPU server already has torch 2.6.0+cu124; this range keeps it (no reinstall).
  "torch>=2.1",
  "scikit-learn>=1.3",
  "lightgbm>=4.0",
  "joblib>=1.3",
]
dev = [
  "pytest>=8.0,<9",
]

[project.scripts]
ald-build-overview = "ald_lab.cli:build_overview_main"
ald-analyze-params = "ald_lab.cli:analyze_params_main"
ald-train = "ald_lab.cli:train_main"
ald-final-test = "ald_lab.cli:final_test_main"
ald-predict = "ald_lab.training.predict:main"
ald-export-model = "ald_lab.training.export:main"
ald-report = "ald_lab.cli:report_main"
ald-queue = "ald_lab.launch:main"
ald-lab-server = "ald_lab.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
